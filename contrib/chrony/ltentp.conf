# chrony settings for evaluating NITZ with ltentp. Put in /etc/chrony/conf.d/.
# UNVERIFIED on hardware.
#
# ltentp sends +CTZEU samples here:
#   ltentp --device /dev/wwan0at1 --chrony-sock /run/chrony/ltentp-nitz.sock
# noselect: observe and log only; never steer the clock from NITZ.
# The default filter is fine for sparse NITZ: a refclock poll with a single
# sample yields a filtered sample (min_samples = 1 in chrony's refclock.c).
refclock SOCK /run/chrony/ltentp-nitz.sock refid NITZ noselect

# The system clock must follow the GNSS reference; ltentp's offset_s is
# "NITZ - reference" only while chrony is synced to it.
# server <GNSS NTP server on the wired LAN> iburst prefer
#
# NTP over the LAN vs over LTE, observed only (ran on the target 2026-11-18
# with NICT's servers). Only the LAN one goes in this file:
# server 133.243.238.163 iburst noselect minpoll 6 maxpoll 6
# The LTE one needs a host route on wwan0 that does not survive a reboot or a
# disconnect, so add it at runtime, after the route, instead of listing it here
# (listed here, it would silently be polled over the LAN after a reboot):
#   ip route add 133.243.238.164/32 dev wwan0 src <wwan0 address>
#   ip route add unreachable 133.243.238.164/32 metric 4000
#   chronyc add server 133.243.238.164 iburst noselect minpoll 6 maxpoll 6
# chrony rejects a comment after a directive ("Could not parse server
# directive"): keep comments on their own lines.

log measurements statistics tracking refclocks
